<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - URL Shortener</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <div class="brand"><span>🔗</span> URL SHORTENER</div>
    <nav>
        <a href="/">Home</a>
        <span id="navAuthSlot"></span>
    </nav>
</header>

<main class="container">
    <section class="card auth-card">
        <h1>Welcome back</h1>
        <p>Log in to manage your links, images, videos and files.</p>

        <form id="loginForm" class="auth-form">
            <label for="identifier">Username or Email</label>
            <input id="identifier" type="text" placeholder="your_name or yourname@example.com" required>

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Your password" required>

            <button type="submit" class="primary">Login</button>
        </form>

        <p id="message" class="message"></p>
        <p class="auth-switch">Don't have an account? <a href="/register.html">Register here</a></p>
    </section>
</main>

<script src="js/auth-common.js"></script>
<script>
    renderAuthNav("navAuthSlot");

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";

        const identifier = document.getElementById("identifier").value.trim();
        const password = document.getElementById("password").value;
        const submitBtn = form.querySelector("button[type=submit]");

        setButtonLoading(submitBtn, true);
        try {
            const response = await fetch(`${API}/auth/login`, {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: identifier, password })
            });
            const result = await response.json();

            if (!response.ok) throw new Error(result.error || "Login failed.");

            window.location.href = result.data.role === "admin" ? "/admin.html" : "/dashboard.html";
        } catch (error) {
            message.textContent = error.message;
            message.style.color = "#d32f2f";
            setButtonLoading(submitBtn, false);
        }
    });
</script>
    <footer>
        <div class="wrap header-inner">
            <p>All Rights Reserved. All other trademarks and copyrights are the property of their respective holders.</p>
            <p>Copyright © 2026 TECH CODERZ<b>.</b></p>
        </div>
    </footer>
</body>
</html>
